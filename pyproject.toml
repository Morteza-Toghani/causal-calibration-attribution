[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"experiments/**/*.py" = ["E402"]
"notebooks/**" = ["E401", "I001"]
"scripts/train_member.py" = ["E402"]
"scripts/train_ensemble.py" = ["E402"]
"scripts/measure_walker2d_timing.py" = ["E402"]