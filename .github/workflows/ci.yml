name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: Capture pip freeze (diagnostic)
        run: pip freeze > pip-freeze-ci.txt

      - name: Upload pip freeze
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze-${{ matrix.python-version }}
          path: pip-freeze-ci.txt
          retention-days: 30

      - name: Rebuild results from raw inputs (hash-checked)
        continue-on-error: true
        run: python scripts/analyze_results.py
